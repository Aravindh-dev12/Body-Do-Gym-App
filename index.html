<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Body workout planner and load calculator. Works offline and keeps your data on your device."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f1eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>Body Do</title>
    <script src="%BASE_URL%theme.js"></script>
    <style>
      /* First paint, before the app has loaded: the ground color and the mark. */
      html {
        background: #f6f1eb;
        color-scheme: light dark;
      }
      .boot {
        display: grid;
        min-height: 100vh;
        place-items: center;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) {
          background: #000000;
        }
      }
      html[data-theme='dark'] {
        background: #000000;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <svg width="56" height="56" viewBox="0 0 30 30" role="img" aria-label="Body Do">
          <rect width="30" height="30" rx="9" fill="#ff2a40" />
          <rect x="11.85" y="5" width="6.3" height="1.6" rx="0.5" fill="#ffffff" />
          <rect x="14.59" y="7.4" width="0.82" height="9.8" fill="#ffffff" />
          <rect x="8.9" y="18" width="12.2" height="1.6" rx="0.4" fill="#ffffff" />
          <rect x="7.68" y="20.5" width="14.65" height="1.6" rx="0.4" fill="#ffffff" />
          <rect x="6.05" y="23" width="17.9" height="1.6" rx="0.4" fill="#ffffff" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
